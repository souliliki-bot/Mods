name: Build Fabric mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit tests
        run: gradle build
      - name: Set up Node.js for two-player integration test
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Minecraft protocol test client
        run: npm install --no-save --no-package-lock mineflayer@4
      - name: Prepare integration test server
        run: |
          mkdir -p run/data
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\npvp=true\nserver-port=25565\nmax-players=2\nspawn-protection=0\nview-distance=4\nsimulation-distance=4\n' > run/server.properties
          printf '{"arenaTeleport":false,"restoreHealth":true,"restoreHunger":true,"roundsPerMatch":1}\n' > run/data/leave-or-steal-settings.json
      - name: Smoke test server and a complete two-player match
        shell: bash
        run: |
          gradle runServer --no-daemon > server.log 2>&1 &
          gradle_pid=$!

          cleanup() {
            pkill -f '[n]et.fabricmc.loader.impl.launch.knot.Knot' || true
            kill "$gradle_pid" 2>/dev/null || true
            wait "$gradle_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 90); do
            if grep -q "Done (" server.log; then
              echo "Fabric server reached the ready state."
              node scripts/match-smoke-test.mjs
              result=$?
              if [ "$result" -ne 0 ]; then
                cat server.log
                exit "$result"
              fi
              exit 0
            fi

            if ! kill -0 "$gradle_pid" 2>/dev/null; then
              wait "$gradle_pid"
              result=$?
              cat server.log
              exit "$result"
            fi

            sleep 2
          done

          cat server.log
          echo "Fabric server did not reach the ready state within 180 seconds."
          exit 1
      - name: Install headless graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Smoke test Minecraft client and mod loading
        shell: bash
        run: |
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 timeout 240s gradle runClient --no-daemon > client.log 2>&1 &
          gradle_pid=$!

          for attempt in $(seq 1 120); do
            if grep -q "Setting user:" client.log && grep -q "leave_or_steal" client.log; then
              echo "Minecraft client started and leave_or_steal appeared in the client log."
              pkill -f '[n]et.fabricmc.devlaunchinjector.Main' || true
              pkill -f '[n]et.fabricmc.loader.impl.launch.knot.KnotClient' || true
              kill "$gradle_pid" 2>/dev/null || true
              wait "$gradle_pid" 2>/dev/null || true
              exit 0
            fi

            if ! kill -0 "$gradle_pid" 2>/dev/null; then
              wait "$gradle_pid"
              result=$?
              cat client.log
              exit "$result"
            fi

            sleep 2
          done

          cat client.log
          pkill -f '[n]et.fabricmc.devlaunchinjector.Main' || true
          pkill -f '[n]et.fabricmc.loader.impl.launch.knot.KnotClient' || true
          kill "$gradle_pid" 2>/dev/null || true
          wait "$gradle_pid" 2>/dev/null || true
          echo "Minecraft client did not reach the expected startup markers within 240 seconds."
          exit 1
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: leave-or-steal-mod
          path: build/libs/*.jar
