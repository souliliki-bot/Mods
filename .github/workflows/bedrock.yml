name: Build Bedrock Android add-on

on:
  push:
    branches: [ bedrock-android ]
    paths:
      - "bedrock/**"
      - ".github/workflows/bedrock.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "bedrock/**"
      - ".github/workflows/bedrock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifests and script syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('bedrock/BP/manifest.json'))"
          node -e "JSON.parse(require('fs').readFileSync('bedrock/RP/manifest.json'))"
          node --check bedrock/BP/scripts/main.js
      - name: Package Android add-on
        run: |
          mkdir -p dist
          cd bedrock
          zip -r ../dist/LeaveOrSteal-Bedrock-Android.mcaddon BP RP
      - uses: actions/upload-artifact@v4
        with:
          name: LeaveOrSteal-Bedrock-Android
          path: dist/LeaveOrSteal-Bedrock-Android.mcaddon
          if-no-files-found: error
